<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>魔女小店 v4.0.2 · Witch's Brew</title>
  <link rel="stylesheet" href="css/style.css?v=4.0.2">
  <link rel="stylesheet" href="css/pixels.css?v=4.0.2">
  <link rel="stylesheet" href="css/ui.css?v=4.0.2">
<link rel="stylesheet" href="scene.css?v=4.0.2">
<link rel="stylesheet" href="layout.css?v=4.0.2">
<link rel="stylesheet" href="music.css?v=4.0.2">
</head>
<body>

<!-- ═══════════════════════════════════════
     SCREEN: NAME INPUT (first launch)
═══════════════════════════════════════ -->
<div id="screen-name" class="screen active">
  <div class="name-box pixel-panel">
    <div class="witch-logo">🧙‍♀️</div>
    <h1 class="game-title">魔女小店</h1>
    <p class="game-subtitle">月下的小店 · 房间的魔法日常</p>
    <div class="name-input-area">
      <label>为你的魔女起个名字吧</label>
      <input type="text" id="witch-name-input" maxlength="12" placeholder="例如：艾露娜" autocomplete="off">
      <button id="btn-start-game" class="pixel-btn btn-primary">走进小店</button>
    </div>
    <p class="flavor-text">「每一杯魔药，都藏着一个故事……」</p>
  </div>
</div>

<!-- ═══════════════════════════════════════
     SCREEN: MAIN GAME
═══════════════════════════════════════ -->
<div id="screen-game" class="screen hidden" style="flex-direction:column;">

  <!-- ── TOP HUD ── -->
  <div id="hud">
    <span class="release-version" style="font-size:11px;color:#cdbb9a">v4.0.2</span>
    <div class="hud-left">
      <span id="hud-witch-name" class="hud-witch-name">魔女</span>
      <span id="hud-phase" class="hud-phase">阶段 0</span>
    </div>
    <div class="hud-center">
      <span id="hud-coins" class="hud-coins">🪙 0</span>
      <span id="hud-earned" class="hud-earned">总收入 🪙0</span>
    </div>
    <div class="hud-right">
      <nav class="panel-nav">
        <button class="pixel-btn btn-nav active" data-panel="modules">🧪 配方</button>
        <button class="pixel-btn btn-nav" data-panel="shop">🏪 商店</button>
        <button class="pixel-btn btn-nav" data-panel="story">📖 故事</button>
        <button class="pixel-btn btn-nav" data-panel="stats">📊 统计</button>
<button id="music-quick" class="pixel-btn btn-nav" data-panel="music">♪ 音乐</button>
      </nav>
    </div>
  </div>

  <!-- Phase progress bar -->
  <div id="phase-progress-track">
    <div id="phase-progress"></div>
  </div>

  <!-- ── MAIN LAYOUT ── -->
  <div id="game-layout">

    <!-- LEFT: ROOM + ORDERS + KEYBOARD -->
    <div id="left-column">

      <!-- Room canvas -->
      <section id="scene-stage" aria-label="女巫房间">
  <div class="scene-heading"><div><span class="eyebrow">WITCH'S LITTLE WORLD</span><h2 id="room-title">经营空间</h2></div><button id="door-shortcut">前往休息室 ↗</button></div>
  <div id="scene-viewport"><canvas id="scene-canvas" width="836" height="760" aria-label="点击地板走动，点击家具交互"></canvas><div id="scene-hotspots"></div></div>
  <div class="scene-footer"><span id="scene-hint" role="status">点击地板走动，靠近家具打开功能</span><button id="interaction-exit" hidden>起身离开</button><button id="walk-tour">看一段走动</button><button id="hotspot-toggle" aria-pressed="true">显示入口</button></div>
  <div id="service-bar"><span id="service-status">休业 · 订单已暂停</span><button id="service-toggle">去柜台营业</button></div>
</section><div id="room-area">
        <canvas id="room-canvas" width="480" height="320"></canvas>
        <div id="room-overlay">
          <div id="customer-area"></div>
          <div id="witch-area">
            <div id="witch-sprite" class="witch-idle"></div>
            <div id="witch-label" class="witch-name-tag"></div>
          </div>
        </div>
      </div>

      <!-- Order queue -->
      <div id="orders-section">
        <h3 class="section-title">📋 当前订单</h3>
        <div id="orders-container">
          <div class="orders-empty">🌙 等待顾客……</div>
        </div>
      </div>

      <!-- Keyboard prompt -->
      <div id="keyboard-zone">
        <div id="kz-title">⌨️ 等待任务...</div>
        <div id="kz-sequence-display"></div>
        <div id="kz-progress-bar"><div id="kz-progress-fill"></div></div>
        <div id="kz-feedback"></div>
        <div id="keyboard-visual"></div><input id="touch-typing" aria-label="打字输入" placeholder="点此输入英文（也可直接使用键盘）" autocomplete="off" autocapitalize="off" spellcheck="false"><div id="typing-status">到柜台开启营业后，按提示拼写单词。</div>
      </div>

    </div>

    <!-- RIGHT: SIDE PANELS -->
    <div id="right-column"><div class="panel-heading"><span id="station-title">配方手册</span><span class="reading-note">阅读时暂停接单</span></div>

      <!-- MODULES PANEL -->
      <div id="panel-modules" class="side-panel">
        <div id="module-tabs">
          <button class="tab-btn active" data-module="potions">🧪 魔药</button>
          <button class="tab-btn" id="tab-divination" data-module="divination">🔮 占卜</button>
          <button class="tab-btn" id="tab-charms" data-module="charms">✨ 符咒</button>
          <button class="tab-btn" id="tab-alchemy" data-module="alchemy">⚗️ 炼金</button>
        </div>
        <div id="module-content">
          <div id="module-potions" class="module-panel active">
            <div id="potion-recipes" class="recipe-grid"></div>
          </div>
          <div id="module-divination" class="module-panel">
            <div id="divination-services" class="recipe-grid"></div>
          </div>
          <div id="module-charms" class="module-panel">
            <div id="charm-services" class="recipe-grid"></div>
          </div>
          <div id="module-alchemy" class="module-panel">
            <div id="alchemy-services" class="recipe-grid"></div>
          </div>
        </div>
      </div>

      <!-- SHOP PANEL -->
      <div id="panel-shop" class="side-panel hidden">
        <h3 class="panel-title">🏪 魔法商店</h3>
        <div id="shop-tabs">
          <button class="shop-tab active" data-shop="unlock">解锁品类</button>
          <button class="shop-tab" data-shop="upgrades">升级</button>
          <button class="shop-tab" data-shop="investments">投资</button>
          <button class="shop-tab" data-shop="inventory">收纳箱</button>
          <button class="shop-tab" data-shop="bond">羁绊</button>
        </div>
        <div id="shop-content"></div>
      </div>

      <!-- STORY PANEL -->
      <div id="panel-story" class="side-panel hidden">
        <h3 class="panel-title">📖 故事档案</h3>
        <div id="story-list"></div>
      </div>

      <section id="panel-music" class="side-panel hidden" aria-label="漂浮音乐盒">
<p class="music-note">让一缕旋律，陪着小店的日常。</p>
<strong id="music-now"></strong><p id="music-status" role="status" aria-live="polite"></p>
<div class="music-buttons"><button id="music-toggle" aria-pressed="false">开启音乐</button><button id="music-resume">开始播放</button></div>
<label for="music-tracks">曲目</label><select id="music-tracks"></select>
<div class="music-buttons"><button id="music-prev">上一首</button><button id="music-next">下一首</button></div>
<label for="music-volume">音量 <output id="music-volume-value">35%</output></label><input id="music-volume" type="range" min="0" max="1" step="0.01">
<label for="music-files">添加自己的音乐</label><input id="music-files" type="file" accept="audio/*,.mp3,.ogg,.wav,.m4a,.aac,.flac" multiple>
<p class="music-note">内置一首曲目，循环播放。添加其他音频后可切换；本地曲目仅本次打开有效，不会上传。切换房间不断曲，离开页面暂歇。</p>
</section>
<!-- STATS PANEL -->
      <div id="panel-stats" class="side-panel hidden">
        <!-- Filled dynamically by UI._renderStats() -->
      </div>

    </div>
  </div>

</div>

<!-- ═══════════════════════════════════════
     PHASE-UP OVERLAY
═══════════════════════════════════════ -->
<div id="phase-overlay" class="hidden">
  <div class="phase-overlay-inner">
    <div class="phase-star">🌟</div>
    <div class="phase-message">新阶段解锁！</div>
  </div>
</div>

<!-- ═══════════════════════════════════════
     PRODUCT UNLOCK MODAL
════════════════════════════════════════ -->
<div id="product-unlock-modal" class="hidden" aria-hidden="true">
  <div class="product-unlock-card" role="dialog" aria-modal="true" aria-labelledby="product-unlock-title">
    <button type="button" class="product-unlock-close" aria-label="关闭">×</button>
    <div id="product-unlock-content"></div>
  </div>
</div>

<!-- ═══════════════════════════════════════
     TOAST CONTAINER
═══════════════════════════════════════ -->
<div id="toast-container"></div>

<!-- ═══════════════════════════════════════
     SCRIPTS (order matters!)
═══════════════════════════════════════ -->
<script src="js/wordbank.js?v=4.0.2"></script>
<script src="js/data.js?v=4.0.2"></script>
<script src="js/state.js?v=4.0.2"></script>
<script src="music.js?v=4.0.2-desk"></script>
<script src="navigation.js?v=4.0.2"></script>
<script src="layers.js?v=4.0.2-desk"></script>
<script src="interactions.js?v=4.0.2"></script>
<script src="visuals.js?v=4.0.2"></script><script src="portal.js?v=4.0.2"></script><script src="scene.js?v=4.0.2-desk"></script>
<script src="js/keyboard.js?v=4.0.2"></script>
<script src="js/customers.js?v=4.0.2"></script>
<script src="js/orders.js?v=4.0.2"></script>
<script src="js/modules.js?v=4.0.2"></script>
<script src="js/shop.js?v=4.0.2"></script>
<script src="js/story.js?v=4.0.2"></script>
<script src="js/ui.js?v=4.0.2"></script>
<script src="layout.js?v=4.0.2"></script>
<script src="js/game.js?v=4.0.2"></script>
</body>
</html>
